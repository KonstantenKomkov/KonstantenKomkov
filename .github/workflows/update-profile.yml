name: Update activity profile

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-activity-profile
  cancel-in-progress: false

jobs:
  update:
    name: Validate hosted activity sources
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Validate API-visible aggregates
        env:
          IT_ACTIVITY_GITHUB_LOGIN: ${{ vars.IT_ACTIVITY_GITHUB_LOGIN }}
          IT_ACTIVITY_AUTHOR_EMAILS: ${{ secrets.IT_ACTIVITY_AUTHOR_EMAILS }}
          IT_ACTIVITY_GITHUB_READ_TOKEN: ${{ secrets.IT_ACTIVITY_GITHUB_READ_TOKEN }}
          IT_ACTIVITY_EXPECTED_REPOSITORIES: ${{ secrets.IT_ACTIVITY_EXPECTED_REPOSITORIES }}
          IT_ACTIVITY_EXCLUDED_REPOSITORIES: ${{ secrets.IT_ACTIVITY_EXCLUDED_REPOSITORIES }}
          IT_ACTIVITY_TIMEZONE: ${{ vars.IT_ACTIVITY_TIMEZONE || 'Europe/Moscow' }}
          PYTHONPATH: src
        run: python -m it_activity usage >/dev/null
