name: Update activity profile

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-activity-profile
  cancel-in-progress: false

jobs:
  update:
    name: Generate and publish aggregates
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Generate public aggregates
        env:
          IT_ACTIVITY_GITHUB_LOGIN: ${{ vars.IT_ACTIVITY_GITHUB_LOGIN }}
          IT_ACTIVITY_AUTHOR_EMAILS: ${{ secrets.IT_ACTIVITY_AUTHOR_EMAILS }}
          IT_ACTIVITY_GITHUB_READ_TOKEN: ${{ secrets.IT_ACTIVITY_GITHUB_READ_TOKEN }}
          IT_ACTIVITY_EXPECTED_REPOSITORIES: ${{ secrets.IT_ACTIVITY_EXPECTED_REPOSITORIES }}
          IT_ACTIVITY_EXCLUDED_REPOSITORIES: ${{ secrets.IT_ACTIVITY_EXCLUDED_REPOSITORIES }}
          IT_ACTIVITY_TIMEZONE: ${{ vars.IT_ACTIVITY_TIMEZONE || 'Europe/Moscow' }}
          PYTHONPATH: src
        run: python -m it_activity generate

      - name: Commit changed public files
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            README.md \
            generated/commits-7.svg \
            generated/commits-30.svg \
            generated/commits-365.svg \
            generated/lines-7.svg \
            generated/lines-30.svg \
            generated/lines-365.svg \
            generated/usage.svg
          if git diff --cached --quiet; then
            echo "Публичные агрегаты не изменились."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update activity profile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
