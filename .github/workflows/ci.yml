name: Quality and security

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned development tools
        run: make bootstrap SYSTEM_PYTHON=python

      - name: Check formatting
        run: make format-check

      - name: Run linter
        run: make lint

      - name: Run type checker
        run: make typecheck

      - name: Run architecture tests
        run: make test PYTEST_ARGS=tests/architecture

      - name: Run activity integration test
        shell: bash
        run: |
          set +e
          test_output="$(make test PYTEST_ARGS="tests/integration -k local_git_activity" 2>&1)"
          test_status=$?
          set -e
          if [[ "$test_status" -eq 0 ]]; then
            exit 0
          fi

          phase="fixture-or-unclassified"
          for allowed_phase in git-not-repository git-dubious-ownership git-unsupported-option git-configuration git-worktree git-exit-128 git-exit-other git-refs-os git-refs-unicode git-refs-value git-refs-subprocess git-refs-runtime git-refs-other git-rev-list-os git-rev-list-unicode git-rev-list-value git-rev-list-subprocess git-rev-list-runtime git-rev-list-other git-cat-file-os git-cat-file-unicode git-cat-file-value git-cat-file-subprocess git-cat-file-runtime git-cat-file-other git-show-os git-show-unicode git-show-value git-show-subprocess git-show-runtime git-show-other author-header author-fields commit-value repository-fixture configuration file-change activity-execute commit-count added-lines deleted-lines first-day last-day last-day-count; do
            if [[ "$test_output" == *"SAFE_PHASE:$allowed_phase"* ]]; then
              phase="$allowed_phase"
              break
            fi
          done
          echo "::error title=Sanitized activity integration failure::$phase"
          exit "$test_status"

      - name: Run usage integration test
        run: make test PYTEST_ARGS="tests/integration -k local_git_usage"

      - name: Run public-output integration test
        run: make test PYTEST_ARGS="tests/integration -k local_git_public_output"

      - name: Run unit tests
        run: make test PYTEST_ARGS=tests/unit

      - name: Check dependency consistency
        run: make dependency-check

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out dependency lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install pinned audit tools
        run: python -m pip install --requirement requirements-audit.lock

      - name: Reject known dependency vulnerabilities
        run: |
          python -m pip_audit --strict --no-deps --disable-pip --requirement requirements-audit.lock
          python -m pip_audit --strict --no-deps --disable-pip --requirement requirements-dev.lock

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: "8.28.0"

  release-gate:
    name: Release gate
    if: always()
    needs:
      - quality
      - dependency-audit
      - secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}

    steps:
      - name: Require every blocking check
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = "success"
          test "$DEPENDENCY_AUDIT_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
